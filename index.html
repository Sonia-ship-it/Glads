<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glads Apartment Hotel | Luxury Living</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              burgundy: '#800020',
              ink: {
                light: '#ffffff',
                dark: '#0a0a0a',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { 
          transition: background-color 0.5s ease, color 0.5s ease; 
          scroll-behavior: smooth;
        }
        
        .glass-nav {
          background: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-nav {
          background: rgba(10, 10, 10, 0.85);
        }

        @keyframes revealUp {
          from { opacity: 0; transform: translateY(40px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .parallax-bg {
          transform: translateZ(0);
          will-change: transform;
        }

        .3d-frame {
          transform-style: preserve-3d;
          transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Luxury scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #262626; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-white text-neutral-900 dark:bg-black dark:text-neutral-100 antialiased font-sans">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
